## 叙事风格

- **视角**: 全知视角，跟随福贵
- **基调**: 现实主义，无过度煽情
- **节奏**: 慢→快，张弛有度
- **色调**: 暖黄→灰暗，符合时代背景
- **禁止**: 美颜滤镜 / 卡通化 / 过度煽情
