# 许三观卖血记 · IP档案

> 版本: v1.0.0
> 来源: manzhou-agent v8.0.0

---

## 核心主题

**"身上的血就像井里的水，不去打也不会多，天天去打也还是那么多。"**

- 底层人民的生存智慧与无奈
- 中国50-70年代社会变迁中的个体命运
- 家庭、亲情、尊严与生存的博弈

---

## 主要人物

### 许三观（男一）

| 字段 | 内容 |
|------|------|
| 年龄 | 25-60岁（跨越作品始终） |
| 职业 | 城里丝厂送茧工 |
| 性格 | 幽默、精明、善良、有担当 |
| 核心特质 | 一辈子靠卖血渡过难关；嘴硬心软；被称为"乌龟"却不放弃家人 |
| 外貌 | 粗眉、憨厚笑容、补丁衣裳 |
| 声音 | 略带沙哑的男中音，说话实在 |

**关键台词：**
> "这身上的血就是一棵摇钱树。"
> "我卖血不是为了做乌龟，是因为这个家需要我。"
> "一乐是我儿子，谁说不是，我揍扁他。"

---

### 许玉兰（女一）

| 字段 | 内容 |
|------|------|
| 年龄 | 22-55岁 |
| 别名 | 油条西施 |
| 性格 | 泼辣、嘴碎、坚强、精明 |
| 核心特质 | 街上最漂亮的女人；爱哭爱闹但关键时刻撑起家；每月"过节" |
| 外貌 | 漂亮、圆润、爱换衣服、丝巾点缀 |
| 声音 | 清亮尖锐，情绪激烈 |

**关键台词：**
> "许三观！你这个狗娘养的……我疼死啦！"
> "我前世造了什么孽啊？"
> "我嫁给你以后，就是吃自己的了，舍不得……"

---

### 一乐（长子）

| 字段 | 内容 |
|------|------|
| 年龄 | 9-20岁 |
| 身世 | 许三观妻子与何小勇所生（非许三观亲生） |
| 性格 | 倔强、重情、勇敢 |
| 核心特质 | 长相酷似何小勇；为许三观出头打架；被许三观发现身世后坚定认父 |

**关键台词：**
> "何小勇不是我爹，我爹是许三观。"

