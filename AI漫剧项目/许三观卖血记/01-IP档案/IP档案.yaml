## 5集剧情主线

### EP01 卖血·娶妻
许三观回乡→第一次卖血→胜利饭店吃炒猪肝→用卖血钱追许玉兰→结婚

### EP02 生子·卖血
婚后生活→许玉兰生一乐二乐三乐→手套织衣的温情→许三观卖血补贴家用

### EP03 发现·挣扎
发现一乐长得像何小勇→许玉兰坦白→许三观愤怒崩溃→决定继续养一乐

### EP04 卖血救子
一乐砸伤方铁匠儿子→方铁匠抄家→何小勇不认→许三观卖血还债

### EP05 一生的血
许三观晚年想卖血（被拒）→回望一生7次卖血→一乐二乐三乐尽孝→温情结尾

