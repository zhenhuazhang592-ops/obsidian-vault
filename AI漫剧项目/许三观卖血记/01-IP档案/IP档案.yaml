### 阿方、根龙（卖血同伴）

| 人物 | 特点 |
|------|------|
| 阿方 | 三十多岁，朴实，卖血盖房子 |
| 根龙 | 十九岁，年轻，为追桂花卖血 |

**关键台词：**
> "我们卖完血以后要上馆子去吃一盘炒猪肝，喝二两黄酒。"
> "猪肝是补血的，黄酒是活血的。"

