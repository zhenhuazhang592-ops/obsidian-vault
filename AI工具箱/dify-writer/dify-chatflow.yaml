# Dify Chatflow Configuration
# AI 写作智能体 - 完整工作流
#
# 在 Dify 中导入此 YAML 配置文件创建 Chatflow
# Dify 版本要求: >= 1.0.0
#
# 导入方式: Dify Console > App > Import from YAML

version: "1.0"

kind: chatflow

name: AI写作智能体
description: 9-Agent 流水线 + 3 HITL确认点 + 质量审查Loop

# 变量定义
variables:
  - name: topic
    type: string
    required: true
    description: 用户输入的主题

  - name: platform
    type: string
    required: false
    default: wechat
    options: [wechat, xiaohongshu, both]
    description: 发布平台

  - name: style_profile
    type: string
    required: false
    default: 专业严谨
    options: [亲和力强, 专业严谨, 幽默风趣, 极简干货]
    description: 写作风格

  - name: framework
    type: string
    required: false
    default: 痛点型
    options: [痛点型, 故事型, 清单型, 对比型, 热点解读型]
    description: 写作框架

  - name: theme
    type: string
    required: false
    default: professional-clean
    options: [professional-clean, tech-modern, warm-editorial, minimal]
    description: HTML排版主题

# 节点定义
nodes:
  # ─────────────────────────────────────────────
  # 0. 入口：意图解析 (LLM)
  # ─────────────────────────────────────────────
  - id: intent_parsing
    type: llm
    name: 意图解析
    model: claude-sonnet-4-6
    prompt: |
      你是一位专业内容策划师，擅长公众号和小红书选题策划。

      ## 用户输入
      {{topic}}

      ## 你的任务
      分析用户输入，解析出：
      1. **平台识别** - 含"公众号/微信/wechat" → wechat，含"小红书/xhs/红书" → xiaohongshu
      2. **框架识别** - 根据主题内容和关键词选择最合适的写作框架
         - 含"热点/事件/最新" → 热点解读型
         - 含"工具/产品/App/软件/测评" → 痛点型
         - 含"我的经历/故事" → 故事型
         - 含"N个/几种/清单/技巧" → 清单型
         - 含"对比/哪个好/vs" → 对比型
         - 默认 → 痛点型
      3. **风格选择** - 根据内容类型推荐风格

      ## 输出
      以 JSON 格式返回：
      ```json
      {
        "platform": "wechat | xiaohongshu | both",
        "framework": "痛点型 | 故事型 | 清单型 | 对比型 | 热点解读型",
        "style_profile": "亲和力强 | 专业严谨 | 幽默风趣 | 极简干货",
        "theme": "professional-clean | tech-modern | warm-editorial | minimal",
        "word_count": 2000-3000,
        "framework_reason": "选择此框架的理由"
      }
      ```
    output_variables:
      - platform
      - framework
      - style_profile
      - theme
      - word_count
      - framework_reason

  # ─────────────────────────────────────────────
  # HITL 1: 策略确认
  # ─────────────────────────────────────────────
  - id: hitl_strategy
    type: human-in-the-loop
    name: HITL1-策略确认
    prompt: |
      📋 **创作策略确认**

      **主题**：{{topic}}
      **发布平台**：{{#intent_parsing.platform#}}
      **写作框架**：{{#intent_parsing.framework#}}
        └ {{#intent_parsing.framework_reason#}}
      **封面风格**：{{#intent_parsing.cover_type#}} + {{#intent_parsing.palette#}}
      **排版主题**：{{#intent_parsing.theme#}}
      **目标字数**：{{#intent_parsing.word_count#}}字
      **预计耗时**：约3-5分钟

      确认开始？回复"开始"继续，或直接告诉我需要调整的地方。
    options:
      - label: 开始创作
        value: approved
      - label: 调整策略
        value: modify

  # ─────────────────────────────────────────────
  # 1. 主题策划 (LLM)
  # ─────────────────────────────────────────────
  - id: planning
    type: llm
    name: ①主题策划
    model: claude-sonnet-4-6
    prompt: |
      你是一位专业内容策划师，擅长公众号和小红书选题策划。

      ## 输入
      - 用户原始主题：{{topic}}
      - 目标平台：{{#intent_parsing.platform#}}
      - 写作框架：{{#intent_parsing.framework#}}

      ## 你的任务
      分析主题，输出策划简报，包括：

      1. **核心主题**（一句话）
      2. **目标受众画像**
         - 身份：（例：25-35岁职场人/创业者/学生...）
         - 痛点：（他们在这个话题上最大的困惑/问题）
         - 期望：（读完这篇文章他们想得到什么）
      3. **独特切入角度**
         - 通常的视角是什么？
         - 我们的差异化视角是什么？
         - 为什么这个角度更有价值？
      4. **内容边界**
         - 要讲的：（核心3个点）
         - 不讲的：（排除哪些内容，为什么）
      5. **情绪基调**
         - 目标情绪：（让读者产生什么感受）
         - 情绪弧线：（从什么情绪到什么情绪）

      ## 输出
      用 JSON 返回：
      ```json
      {
        "core_theme": "",
        "audience": { "identity": "", "pain_point": "", "expectation": "" },
        "angle": { "common_view": "", "our_view": "", "value": "" },
        "scope": { "include": [], "exclude": [] },
        "tone": { "target_emotion": "", "arc": "" }
      }
      ```

  # ─────────────────────────────────────────────
  # 2. 深度研究 (Agent - Tavily + Obsidian)
  # ─────────────────────────────────────────────
  - id: research
    type: agent
    name: ②深度研究
    model: claaude-sonnet-4-6
    tools:
      - name: tavily_research
        config:
          search_depth: advanced
          max_results: 8
          include_raw_content: true
      - name: obsidian_mcp
        config:
          vault_path: /Users/huage/Obsidian Vault
          limit: 5
    prompt: |
      你是一位深度研究员，负责为文章收集最新、最有价值的信息。

      ## 输入
      - 主题：{{topic}}
      - 策划简报：{{#planning.output#}}

      ## 研究任务

      ### 第一步：时效信息搜索
      使用 Tavily 搜索以下3个查询，合并结果：
      1. "{{topic}} 最新 {{current_year}}"
      2. "{{topic}} 真实案例 数据"
      3. "{{topic}} 不同观点 批评"

      ### 第二步：知识库查询
      查询 Obsidian 知识库中与主题相关的已有知识点。

      ### 第三步：整合研究报告
      ```json
      {
        "key_findings": [
          { "point": "关键发现", "source": "来源", "relevance": "与主题的关联" }
        ],
        "data_points": ["可引用的具体数据"],
        "cases": ["具体案例（人物/事件/数字）"],
        "counter_views": ["反驳/争议观点"],
        "author_style": {
          "opening_style": "",
          "sentence_rhythm": "",
          "emotion_density": "",
          "signature_phrases": [],
          "humor_level": ""
        }
      }
      ```

      重要：只收集事实，不生成观点。观点由内容写作Agent负责。

  # ─────────────────────────────────────────────
  # 3. 大纲规划 (LLM)
  # ─────────────────────────────────────────────
  - id: outline
    type: llm
    name: ③大纲规划
    model: claude-sonnet-4-6
    prompt: |
      你是一位内容架构师，专注于公众号和小红书的文章结构设计。

      ## 输入
      - 主题：{{topic}}
      - 策划简报：{{#planning.output#}}
      - 研究报告：{{#research.output#}}
      - 写作框架：{{#intent_parsing.framework#}}
      - 平台：{{#intent_parsing.platform#}}

      ## 任务1：生成3个标题候选

      ### 标题规则（微信公众号）
      - 长度：20-28个中文字
      - 不用标题党（微信降权）
      - 每个标题用不同策略：冲突对比型、疑问引导型、数字+效果型、否定+反转型

      ### 标题规则（小红书）
      - 长度：≤20字（封面可见）
      - 必须含热词或情绪词

      ## 任务2：生成文章骨架

      根据框架类型构建结构：

      ### 痛点型骨架
      ```
      开头（痛点共鸣，150字）
      H2: [痛点放大标题]（250-350字）
      H2: [解决方案标题]（400-600字）
      H2: [实操验证标题]（300-400字，可选）
      结尾（行动引导，100字）
      ```

      ### 故事型骨架
      ```
      开头（悬念钩子，200字）
      H2: [背景铺垫标题]（200字以内）
      H2: [转折高潮标题]（500-700字）
      H2: [深度解读标题]（300-400字）
      结尾（情绪共振，100字）
      ```

      ### 清单型骨架
      ```
      开头（价值承诺，150字）
      H2: [第1项标题]（200-300字）
      ...（N项）
      结尾（总结+彩蛋，150字）
      ```

      ## 输出
      ```json
      {
        "title_candidates": [
          { "title": "", "strategy": "", "reason": "" }
        ],
        "structure": [
          { "type": "opening|h2|closing", "heading": "", "word_count": 0 }
        ],
        "seo": {
          "primary_keyword": "",
          "secondary_keywords": [],
          "tags": []
        },
        "total_word_count": 0
      }
      ```

  # ─────────────────────────────────────────────
  # HITL 2: 大纲确认
  # ─────────────────────────────────────────────
  - id: hitl_outline
    type: human-in-the-loop
    name: HITL2-大纲确认
    prompt: |
      📝 **大纲确认**

      **标题候选**（请选1个或提供修改意见）：
      A. {{#outline.output.title_candidates[0]#}}
      B. {{#outline.output.title_candidates[1]#}}
      C. {{#outline.output.title_candidates[2]#}}

      **文章结构**：
      {{#outline.output.structure#}}

      **核心关键词**：{{#outline.output.seo.primary_keyword#}}

      确认大纲？回复"确认"继续，或指出需要调整的地方。
    options:
      - label: 确认大纲
        value: approved
      - label: 修改标题
        value: modify_title
      - label: 修改结构
        value: modify_structure

  # ─────────────────────────────────────────────
  # 4. 内容写作 (LLM)
  # ─────────────────────────────────────────────
  - id: writing
    type: llm
    name: ④内容写作
    model: claude-sonnet-4-6
    max_tokens: 8192
    prompt: |
      你是一位专业内容写作师，专注于公众号和小红书文章创作。

      ## 输入
      - 已选标题：{{#hitl_outline.selected_title#}}
      - 文章骨架：{{#outline.output.structure#}}
      - 研究报告：{{#research.output#}}
      - 作者风格：{{#research.output.author_style#}}
      - 平台：{{#intent_parsing.platform#}}

      ## 写作硬性规则

      ### 禁止（会导致文章被退回）
      ❌ 条目式开头："首先...其次...最后..."
      ❌ AI填充词："值得注意的是"、"毋庸置疑"、"综上所述"
      ❌ 空洞开场："在当今快速发展的时代..."
      ❌ 无来源数据："据研究表明"

      ### 必须做到
      ✅ 开头3句话内进入正题
      ✅ 长短句交错（长句≤150字，短句1-2句）
      ✅ 第一人称"我"
      ✅ 具体数字优于模糊描述
      ✅ 每500字用金句锚定
      ✅ 段落间自然过渡

      ## 篇幅要求
      | 平台 | 类型 | 目标字数 |
      |------|------|---------|
      | 公众号 | 工具介绍/方法教程 | 2000-3000字 |
      | 公众号 | 深度思考 | 2500-3500字 |
      | 小红书 | 所有类型 | 800-1200字 |

      ## 金句要求
      每篇文章至少3句易传播金句，格式：**[金句]**（加粗）

      ## 输出
      返回完整正文（Markdown格式），图片位置用占位符：`[IMAGE: {类型描述}]`

  # ─────────────────────────────────────────────
  # 5. 润色优化 (LLM)
  # ─────────────────────────────────────────────
  - id: polish
    type: llm
    name: ⑤润色优化
    model: claude-sonnet-4-6
    prompt: |
      你是一位资深文字编辑，专注于将AI生成内容转化为真人手笔。

      ## 输入
      - 原始草稿：{{#writing.output#}}
      - 作者风格档案：{{#research.output.author_style#}}
      - 质量审查反馈（如有）：{{#quality_feedback#}}
      - 风格类型：{{#intent_parsing.style_profile#}}

      ## 润色流程

      ### Step 1：去AI化扫描

      #### 必须删除或替换
      | AI高频词 | 替换方向 |
      |---------|---------|
      | 首先/其次/最后/总之 | 用叙事语气替代序号 |
      | 值得注意的是/应该注意 | 直接陈述事实 |
      | 综上所述/由此可见 | 自然收尾 |
      | 毋庸置疑/无可争辩 | 用"我觉得"等个人表述 |

      #### 必须添加
      - 口语化表达：说实话/讲真/怎么说呢
      - 个人标记：我觉得/我发现/我用过的经验是
      - 不完美感：可能/或许/也许/大概

      ### Step 2：风格适配

      **亲和力强型**：增加反问、适度自嘲、口语化比喻
      **专业严谨型**：数据支撑、减少情绪词、保留"我认为"
      **幽默风趣型**：轻松调侃、生动比喻、适时感叹词
      **极简干货型**：删除废话、一句一意、去情绪修饰

      ### Step 3：完读率优化
      - 每段不超过150字
      - 每3-4段设置一个钩子
      - H2标题要有信息量

      ## 输出
      返回润色后的完整正文（Markdown格式），保留图片占位符。

  # ─────────────────────────────────────────────
  # 6. 质量审查 (LLM + Condition)
  # ─────────────────────────────────────────────
  - id: quality_check
    type: llm
    name: ⑥质量审查
    model: claude-sonnet-4-6
    prompt: |
      你是一位严格的内容质量审查员，负责评估文章是否达到发布标准。

      ## 输入
      - 文章（含标题）：{{#polish.output#}}
      - 写作框架：{{#intent_parsing.framework#}}
      - 平台：{{#intent_parsing.platform#}}
      - 当前审查轮次：{{loop_count}}/3

      ## 6维度评分标准

      | 维度 | 满分 | 评分标准 |
      |------|------|---------|
      | **去AI化程度** | 20分 | 无AI腔词汇=20，少量=15，明显=8，严重=0 |
      | **信息密度** | 20分 | 有具体数据/案例=20，部分=12，空洞=0 |
      | **风格一致性** | 15分 | 与作者风格高度匹配=15，基本=10，不匹配=0 |
      | **完读率设计** | 15分 | 有节奏钩子/视觉节奏良好=15，一般=8，差=0 |
      | **标题吸引力** | 15分 | 有冲突/数字/反转等爆款要素=15，一般=8，差=0 |
      | **SEO/GEO结构** | 15分 | 关键词合理布局=15，一般=8，差=0 |

      ## 输出
      ```json
      {
        "total_score": 0,
        "pass": false,
        "dimensions": {
          "de_ai": { "score": 0, "issues": [], "suggestions": [] },
          "information_density": { "score": 0, "issues": [], "suggestions": [] },
          "style_consistency": { "score": 0, "issues": [], "suggestions": [] },
          "readability": { "score": 0, "issues": [], "suggestions": [] },
          "title_appeal": { "score": 0, "issues": [], "suggestions": [] },
          "seo_geo": { "score": 0, "issues": [], "suggestions": [] }
        },
        "priority_fixes": ["最重要的1-3个修改点"],
        "loop_note": "第{loop_count}次审查"
      }
      ```

  - id: quality_condition
    type: condition
    name: 质量判断
    conditions:
      - if: "{{#quality_check.total_score#}} >= 85"
        next: image_generation
      - if: "{{#quality_check.total_score#}} < 85"
        next: polish  # 带反馈回润色

  # ─────────────────────────────────────────────
  # 7-A. 封面图生成 (LLM + HTTP)
  # ─────────────────────────────────────────────
  - id: cover_generation
    type: llm
    name: ⑦-A封面图生成
    model: claude-sonnet-4-6
    prompt: |
      你是一位专业的AI图像提示词工程师，专注于封面图生成。

      ## 输入
      - 文章标题：{{#hitl_outline.selected_title#}}
      - 文章主题：{{topic}}
      - 封面规格：type={{cover_type}}, palette={{palette}}, rendering={{rendering}}
      - 平台：{{#intent_parsing.platform#}}

      ## 5维度参数

      ### Type（构图类型）
      - hero：主体人物/产品，强烈聚焦
      - conceptual：抽象概念视觉化
      - typography：文字为主视觉
      - scene：完整场景描述

      ### Palette（色彩）
      - warm：#ED8936橙/#F6AD55金黄
      - elegant：#553C9A深紫/#7C3AED紫
      - cool：#2B6CB0深蓝/#3182CE蓝
      - dark：#1A202C背景，亮色主体

      ### Rendering（渲染风格）
      - flat-vector：扁平插画
      - hand-drawn：手绘线条感
      - painterly：绘画质感
      - digital：数字艺术

      ## 输出
      ```json
      {
        "prompt": "完整英文Prompt",
        "dimensions": "900x383",
        "aspect_ratio": "2.35:1"
      }
      ```

  - id: cover_api
    type: http-request
    name: 即梦封面API
    method: POST
    url: https://ark.cn-beijing.volces.com/api/v3/images/generations
    headers:
      Authorization: Bearer {{JIMENG_API_KEY}}
      Content-Type: application/json
    body: |
      {
        "model": "doubao-seedream-3-0-t2i-250415",
        "prompt": "{{#cover_generation.output.prompt#}}",
        "size": "{{#cover_generation.output.dimensions#}}",
        "n": 1,
        "response_format": "url"
      }

  # ─────────────────────────────────────────────
  # 7-B. 内文配图生成 (LLM + HTTP)
  # ─────────────────────────────────────────────
  - id: inline_images
    type: llm
    name: ⑦-B内文配图
    model: claude-sonnet-4-6
    prompt: |
      你是一位内容图像策划师，负责为文章配置内文插图。

      ## 输入
      - 完整文章：{{#polish.output#}}
      - 文章风格：{{cover_type}}, {{palette}}
      - 平台：{{#intent_parsing.platform#}}

      ## 工作流程

      ### Step 1：识别配图位置
      扫描文章，找到所有 `[IMAGE: {描述}]` 占位符。
      通常每篇文章需要2-4张内文图。

      ### Step 2：确定每张图的规格
      ```json
      [
        {
          "position": "第X段后",
          "image_type": "infographic|scene|flowchart|comparison",
          "description": "图片内容描述（中文）",
          "prompt": "英文Prompt"
        }
      ]
      ```

      ## 输出
      返回配图规格列表

  - id: inline_api
    type: http-request
    name: 即梦内文API
    method: POST
    url: https://ark.cn-beijing.volces.com/api/v3/images/generations
    headers:
      Authorization: Bearer {{JIMENG_API_KEY}}
      Content-Type: application/json
    body: |
      {
        "model": "doubao-seedream-3-0-t2i-250415",
        "prompt": "{{#inline_images.output.prompts[0]#}}",
        "size": "900x500",
        "n": 1,
        "response_format": "url"
      }

  # ─────────────────────────────────────────────
  # 8. HTML排版 (LLM)
  # ─────────────────────────────────────────────
  - id: html_layout
    type: llm
    name: ⑧HTML排版
    model: claude-sonnet-4-6
    prompt: |
      你是一位专业的微信公众号HTML排版工程师。

      ## 输入
      - 润色后正文：{{#polish.output#}}
      - 选定标题：{{#hitl_outline.selected_title#}}
      - 封面图URL：{{#cover_api.output.0.url#}}
      - 内文配图列表：{{#inline_api.output.urls#}}
      - 排版主题：{{#intent_parsing.theme#}}
      - 平台：{{#intent_parsing.platform#}}

      ## 微信HTML限制（重要！）
      - 只用 style 属性内联CSS
      - 不用 :hover、@media 等伪类
      - 不用 <script>
      - img 必须是网络URL

      ## 4套主题

      ### professional-clean（专业简洁）
      - 主色：#2563eb
      - 字体：-apple-system, PingFang SC
      - 背景：白色

      ### tech-modern（科技现代）
      - 主色：#7c3aed
      - 背景：#0f0f23（深色）
      - 字体：SF Mono, Fira Code

      ### warm-editorial（温暖叙事）
      - 主色：#d97706
      - 字体：Georgia, 宋体
      - 背景：#fffbf0

      ### minimal（极简）
      - 主色：#1a1a1a
      - 背景：白色
      - 字体：Helvetica Neue

      ## 输出
      1. 完整HTML字符串
      2. SEO报告（Markdown）
      3. 元数据JSON

  # ─────────────────────────────────────────────
  # HITL 3: 最终预览
  # ─────────────────────────────────────────────
  - id: hitl_final
    type: human-in-the-loop
    name: HITL3-最终预览
    prompt: |
      🎉 **创作完成！**

      **质量评分**：{{#quality_check.total_score#}}/100
      **字数**：{{#html_layout.word_count#}}字
      **配图**：封面×1 + 内文×{{#inline_images.output.count#}}张

      已生成完整 HTML 版本，可直接复制到公众号编辑器。

      是否需要调整任何内容？
    options:
      - label: 确认发布
        value: approved
      - label: 修改内容
        value: modify

# 连接定义
edges:
  - source: intent_parsing
    target: hitl_strategy

  - source: hitl_strategy
    target: planning
    condition: approved

  - source: planning
    target: research

  - source: research
    target: outline

  - source: outline
    target: hitl_outline

  - source: hitl_outline
    target: writing
    condition: approved

  - source: writing
    target: polish

  - source: polish
    target: quality_check

  - source: quality_check
    target: quality_condition

  - source: quality_condition
    target: cover_generation
    condition: score >= 85

  - source: quality_condition
    target: polish
    condition: score < 85

  - source: cover_generation
    target: html_layout

  - source: html_layout
    target: hitl_final

  - source: hitl_final
    target: end
    condition: approved

# 质量 Loop 配置
quality_loop:
  max_iterations: 3
  exit_condition: score >= 85
  fallback_condition: iteration >= 3

# 图像生成并行配置
image_generation:
  type: parallel
  nodes:
    - cover_generation
    - inline_images
