<!-- 漠玫品牌 Logo · 横向版 -->
<!-- 漠玫绿底白字，适用于横版海报右下角、详情页页脚 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <style>
      .bg { fill: #2E7D32; }
      .wordmark-zh {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
        font-weight: 700;
        font-size: 28px;
        fill: #FFFFFF;
        letter-spacing: 0.08em;
      }
      .wordmark-en {
        font-family: 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
        font-weight: 400;
        font-size: 14px;
        fill: rgba(255,255,255,0.85);
        letter-spacing: 0.12em;
      }
    </style>
  </defs>

  <!-- 背景色块：漠玫绿 -->
  <rect width="200" height="50" rx="6" class="bg"/>

  <!-- 左侧装饰竖线 -->
  <rect x="12" y="12" width="3" height="26" rx="1.5" fill="#D4A853"/>

  <!-- 中文品名 -->
  <text x="24" y="34" class="wordmark-zh">漠玫</text>

  <!-- 英文副标 -->
  <text x="76" y="33" class="wordmark-en">MoMei</text>
</svg>
