<!-- 漠玫品牌 Logo · 图标版 -->
<!-- 圆形图标，适用于小尺寸场景、App Icon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <defs>
    <style>
      .bg { fill: #2E7D32; }
      .icon {
        font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
        font-weight: 700;
        font-size: 22px;
        fill: #FFFFFF;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>

  <!-- 圆形背景：漠玫绿 -->
  <circle cx="30" cy="30" r="30" class="bg"/>

  <!-- 内圈装饰环（金色） -->
  <circle cx="30" cy="30" r="22" fill="none" stroke="#D4A853" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- 中文品名（居中） -->
  <text x="30" y="37" text-anchor="middle" class="icon">漠玫</text>
</svg>
