## 场景库

### loc_01: 村口老槐树下

| 属性 | 内容 |
|------|------|
| **名称** | 村口老槐树下 |
| **描述** | 江南农村村口，一棵百年老槐，树冠如盖，树干粗壮，树皮皲裂，树下有青石板，村民常在此歇脚聊天 |
| **时代感** | 1960年代，土墙灰瓦，泥坯房 |
| **光影** | 早晨阳光斜照，树影斑驳 |
| **道具** | 老槐树，青石板 |

### loc_02: 乡间土路

| 属性 | 内容 |
|------|------|
| **名称** | 乡间土路 |
| **描述** | 连接村庄与城镇的泥路，雨后泥泞，晴天扬灰，两旁是水田，远处青山如黛 |
| **时代感** | 1960年代，人力为主 |
| **光影** | 上午日光，天空灰蒙蒙 |
| **道具** | 泥路，水田，秧苗，远处青山 |

### loc_03: 县城医院

| 属性 | 内容 |
|------|------|
| **名称** | 县城医院 |
| **描述** | 灰白建筑，玻璃窗，铁门，墙上刷着"为人民服务"，走廊昏暗，有消毒水味 |
| **时代感** | 1960年代国营单位 |
| **光影** | 室内昏暗，室外明亮 |
| **道具** | 橡胶管，针管，玻璃瓶 |

### loc_04: 胜利饭店

| 属性 | 内容 |
|------|------|
| **名称** | 胜利饭店 |
| **描述** | 国营小饭馆，木头桌椅，油腻桌面，墙上挂着菜牌，蒸汽腾腾，嘈杂热闹 |
| **时代感** | 1960年代，国营饭店 |
| **光影** | 室内暖黄灯光，蒸汽朦胧 |
| **道具** | 木桌木椅，搪瓷碗，酒盅，竹筷 |

