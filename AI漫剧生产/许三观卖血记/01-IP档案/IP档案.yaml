## 视觉风格

### 主色调

- **土黄**：泥土、墙壁、皮肤
- **灰白**：医院、建筑、天空
- **暗红**：血液、猪肝、危险
- **暖黄**：灯光、胜利饭店

### 光线风格

- **自然光为主**：户外戏用自然光
- **侧光强调**：人物面部立体感
- **暖黄内景**：饭店室内用暖光

### 情绪基调

- **Section 1**：好奇/期待（村口）
- **Section 2**：紧张/神秘（路上）
- **Section 3**：紧张/胜利（医院）
- **Section 4**：满足/膨胀（饭店）

---

## 叙事风格

### 余华写实主义特点

1. **苦难底色**：但不过度煽情
2. **黑色幽默**：苦中作乐的生存智慧
3. **细节真实**：道具、服饰、语言的时代还原
4. **留白与克制**：不说破，让画面说话

### 本集叙事节奏

```
Section 1（好奇）：节奏舒缓，镜头平稳
Section 2（规矩）：节奏加快，信息密度高
Section 3（紧张）：节奏紧凑，镜头逼近
Section 4（胜利）：节奏放慢，仪式感强
```
