# AI漫剧生产系统 - 主配置文件
# 版本: 2.0.0 | 更新: 2026-03-25

version: "2.0.0"
last_updated: "2026-03-25"

# ==================== 项目结构 ====================
project:
  base_path: "AI漫剧生产/"
  template:
    - "00-项目信息/"
    - "01-IP档案/"
    - "02-剧本/"
    - "03-分镜/"
    - "04-Prompts/"
    - "05-资产库/"
    - "07-音频包/"

# ==================== 角色ID体系 ====================
character:
  id_format:
    protagonist: "protagonist_XX"    # protagonist_01, protagonist_02
    antagonist: "antagonist_XX"
    supporting: "supporting_XX"
    cameo: "cameo_XX"
  fingerprint:
    versions: ["V1", "V2", "V3", "V4", "V5"]
    suffix_format: "_V{n}"          # LinFeng_V1, LinFeng_V2
    base_dir: "05-资产库/角色库/"

# ==================== 角色标记（统一格式） ====================
markup:
  # 角色名标记：分镜中禁止描述外貌
  character: "【【{name}】】"        # 【【LinFeng】】
  
  # 指纹标记：用于Seedance/Kling角色锁定
  fingerprint: "{name}_{V{n}}"       # LinFeng_V1
  
  # 禁止项
  prohibited:
    - "外貌描述"                      # 分镜禁止描述角色外貌
    - "..."                          # 禁止占位符
    - "等"                           # 禁止"以此类推"
    - "如图所示"                      # 禁止模糊描述

# ==================== 景别规范 ====================
shot_size:
  WS:
    code: "WS"
    name: "Wide Shot"
    chinese: "全景"
    usage: "交代环境/群体场景"
  MLS:
    code: "MLS"
    name: "Medium Long Shot"
    chinese: "中全景"
    usage: "人物与背景关系"
  MS:
    code: "MS"
    name: "Medium Shot"
    chinese: "中景"
    usage: "标准对话/日常场景"
  MCU:
    code: "MCU"
    name: "Medium Close-Up"
    chinese: "中近景"
    usage: "重点对话/情感表达"
  CU:
    code: "CU"
    name: "Close-Up"
    chinese: "特写"
    usage: "情绪特写/关键物品"
  ECU:
    code: "ECU"
    name: "Extreme Close-Up"
    chinese: "大特写"
    usage: "极致情绪/细节放大"
  POV:
    code: "POV"
    name: "Point of View"
    chinese: "主观视角"
    usage: "角色视角/沉浸感"

# ==================== 镜头时长标准（统一） ====================
# 来源: manzhou-storyboard.md（详细景别版）+ manzhou-script.md（场景版）
# 权威定义：按景别的建议时长范围
timing:
  # 按景别的时长标准（单位：秒）
  by_shot_size:
    ELS: { min: 6, max: 10, desc: "极远景/建立镜头" }
    LS:  { min: 6, max: 10, desc: "全景" }
    WS:  { min: 5, max: 8,  desc: "宽景" }
    MLS: { min: 5, max: 8,  desc: "中全景" }
    MS:  { min: 5, max: 8,  desc: "中景" }
    MCU: { min: 4, max: 6,  desc: "中近景" }
    CU:  { min: 3, max: 5,  desc: "特写" }
    ECU: { min: 2, max: 4,  desc: "大特写" }
    POV: { min: 3, max: 6,  desc: "主观视角" }

  # 按场景类型的时长标准
  by_scene_type:
    establishing:   { min: 5, max: 10, desc: "建立镜头" }
    dialogue:       { min: 5, max: 8,  desc: "对话场景" }
    emotional:      { min: 3, max: 5,  desc: "情绪特写" }
    action:         { min: 6, max: 10, desc: "动作连续" }
    transition:     { min: 1, max: 2,  desc: "转场" }
    VO_narration:   { min: 4, max: 8,  desc: "旁白镜头" }

  # 单集目标
  episode_target:
    duration: "3-5分钟"
    shot_count: "12-20个"
    avg_per_shot: "6-10秒"

  # 全局约束
  constraints:
    min: 2
    max: 10

# ==================== 情绪向量（EmoVec） ====================
emotion_vector:
  dimensions: 8
  labels: ["喜", "怒", "哀", "惧", "厌恶", "低落", "惊喜", "平静"]
  range: [0.0, 1.0]

# ==================== 相机参数 ====================
camera:
  movement:
    - Pan          # 水平摇
    - Tilt         # 垂直摇
    - Dolly        # 推拉
    - Crane        # 升降
    - Tracking     # 跟踪
    - handheld     # 手持
  yz_axis: "180度轴线规则（过肩镜头可突破）"
  dolly_unit: "dolly: {distance}m"   # dolly: 2m

# ==================== Prompt格式 ====================
prompt:
  seedance:
    suffix: "--ar 16:9 --style vivid --quality high --seed {seed}"
  kling:
    suffix: "--aspect 16:9 --duration 5 --quality hd"
