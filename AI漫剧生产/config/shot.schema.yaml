# 分镜参数Schema

version: "2.0.0"
last_updated: "2026-03-25"

# ==================== 相机运动 ====================
camera:
  movement:
    - Pan
      name: "水平摇"
      description: "摄像机左右水平转动"
      
    - Tilt
      name: "垂直摇"
      description: "摄像机上下转动"
      
    - Dolly
      name: "推拉"
      description: "摄像机前进或后退"
      unit: "米"
      
    - Crane
      name: "升降"
      description: "摄像机垂直升降"
      
    - Tracking
      name: "跟踪"
      description: "摄像机跟随主体移动"
      
    - handheld
      name: "手持"
      description: "不稳定的跟拍效果"

  # 180度轴线规则
  axis_rule: "180度轴线规则（过肩镜头可突破）"
  
  # Dolly参数格式
  dolly_format: "dolly: {distance}m"   # dolly: 2m

# ==================== 九宫格代号 ====================
grid_code:
  S: "侧脸/四分之三"      # 90度侧颜
  M: "正脸/中景"          # 0度正面
  A: "仰角"              # 从下往上
  B: "俯角"              # 从上往下
  W: "全身"              # 展示整体
  T: "上半身"            # 胸口以上
  C: "特写"              # 面部大特写
  O: "背面"              # 背面照
  
  # 注意事项
  note: "原v1.0.0中Si=S有历史错误，已修正为本版本"

# ==================== 分镜七要素 ====================
shot_elements:
  - shot_number: "镜号"
    format: "第X镜"
    
  - shot_size: "景别"
    ref: "manzhou.config.yaml#shot_size"
    
  - camera_movement: "相机运动"
    ref: "shot.schema.yaml#camera/movement"
    
  - character_action: "角色动作"
    rule: "必须使用【【角色名】】标记"
    
  - scene_description: "场景描述"
    rule: "禁止描述角色外貌"
    
  - dialogue: "台词"
    format: 'voice:({情绪}/{语速})"台词"'
    
  - audio: "音频"
    elements:
      - "[BGM: 情绪描述]"
      - "[SFX: 音效]"

# ==================== 分镜输出格式 ====================
output_format:
  markdown:
    header: "## 第{集数}集 分镜表"
    columns: ["镜号", "景别", "镜头运动", "角色动作", "场景描述", "台词", "音频"]
    
  seedance:
    prompt_structure:
      - "{scene_description}"
      - "{character_action}"
      - "{camera_movement}"
      - "{shot_size}"
      - "{visual_style}"
      
  kling:
    prompt_structure:
      - "{scene_description}"
      - "{character_action}"
      - "{camera_movement}"
      - "{shot_size}"
