# 视觉风格映射

version: "2.0.0"
last_updated: "2026-03-25"

# ==================== 电影风格 ====================
movie_styles:
  - id: "hollywood"
    name: "好莱坞"
    description: "高对比度、戏剧光影、饱和色彩"
    prompt_suffix: "--style cinematic, dramatic lighting, vivid colors"
    mood: "戏剧性"
    
  - id: "wongkarwai"
    name: "王家卫"
    description: "慢镜头、霓虹色彩、抽帧、浪漫孤独"
    prompt_suffix: "--style neon-lit, slow motion, romantic melancholy"
    mood: "浪漫孤独"
    
  - id: "shortdrama"
    name: "短剧风"
    description: "快节奏、高潮迭起、强冲突、强反转"
    prompt_suffix: "--style fast-paced, dramatic, high contrast"
    mood: "强冲突"
    
  - id: "cyberpunk"
    name: "赛博朋克"
    description: "霓虹蓝紫、数字网格、阴暗对比"
    prompt_suffix: "--style cyberpunk, neon blue purple, digital grid"
    mood: "科技感"
    
  - id: "realistic"
    name: "现实纪录"
    description: "自然光、浅景深、真实质感"
    prompt_suffix: "--style realistic, natural lighting, shallow depth"
    mood: "真实感"

# ==================== 动漫风格 ====================
anime_styles:
  - id: "anime_mainstream"
    name: "日漫主流"
    prompt_suffix: "--style vivid, anime, vibrant"
    
  - id: "anime_ghibli"
    name: "吉卜力"
    prompt_suffix: "--style ghibli, anime, hand-drawn"
    
  - id: "anime_cartoon"
    name: "卡通渲染"
    prompt_suffix: "--style cartoon, 3d render"
    
  - id: "anime_comic"
    name: "美漫厚涂"
    prompt_suffix: "--style comic, oil painting"

# ==================== 风格映射表 ====================
style_mapping:
  hollywood: "anime_mainstream"
  wongkarwai: "anime_ghibli"
  shortdrama: "anime_mainstream"
  cyberpunk: "anime_mainstream"
  realistic: "anime_comic"

# ==================== 四维度锚点 ====================
visual_dimensions:
  - dimension: "光影"
    values: ["高对比", "柔和", "戏剧性", "自然"]
    
  - dimension: "色彩"
    values: ["高饱和", "低饱和", "霓虹", "黑白"]
    
  - dimension: "构图"
    values: ["广角", "特写", "对称", "倾斜"]
    
  - dimension: "氛围"
    values: ["紧张", "放松", "神秘", "温暖"]
