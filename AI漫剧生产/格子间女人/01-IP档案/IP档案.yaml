    隐藏恐惧: 失控 / 被迫离开 / 依附他人
    人物弧线: 专业冷静→危机应对→职业成长
    当前处境: 上升期 / 职业稳定
    隐藏身份: 无
    关系:
      supporting_01: 敬畏/倾慕（上司程睿敏）
      supporting_02: 信任/下属（直接经理余永麟）

  - id: supporting_01
