## 核心冲突
conflicts:
  - id: conflict_01
    类型: 职场政治
    描述: 程睿敏突然被宣布离职，门卡失效，方式异常粗暴，暗示内部权力斗争
    涉及: [supporting_01, supporting_02, protagonist_01]
    爆发点: 第1集开场即触发

  - id: conflict_02
    类型: 职场生存
    描述: 谭斌作为程睿敏系的人，在新权力格局下的生存挑战
    涉及: [protagonist_01, supporting_02]
    爆发点: 第2-3集逐步展开

## 情绪主线
emotion:
  基调: 悬疑 / 职场现实
  爽点:
    - 谭斌的专业表现（客户会议拿下）
    - 冷静判断危机形势
  虐点:
    - 上司突然出局，前途未卜
    - 无力改变局面的职场现实
  情感曲线: 平静→震惊→焦虑→强撑冷静→职业表现
  爆点密度: 每3分钟一个转折
  反转频率: 每集至少1个

## 悬念设计
mysteries:
  - id: mystery_01
    类型: 未解事件
    描述: 程睿敏为什么突然被出局？背后真正的推手是谁？
    揭晓时机: 第3-4集

  - id: mystery_02
    类型: 隐藏身份
    描述: 新CEO李海洋的真实意图是什么？会如何处置程睿敏旧部？
    揭晓时机: 第5-6集

