# IP档案 - 格子间女人
> 生成时间: 2026-03-24
> 版本: v1.0
> 解析模式: 完整模式（基于小说Chapter 1文本）

## 基本信息
项目名: 格子间女人
类型: 小说改编
集数: 12集（本次测试输出第1集）
单集时长: 3-5分钟
原著: 舒仪

## 世界观
时间背景: 现代都市
空间背景: 北京CBD/MPL大厦/国贸/望京
社会结构: 职场精英 / 跨国企业 / 商业阶层
力量体系: 商业能力 / 职场人脉 / 专业技能
核心规则: 权力/业绩/人脉/职场政治
特点: 现代职场商战内核，外表光鲜的精英生活背后是残酷的权力博弈

## 人物体系
characters:
  - id: protagonist_01
    英文名: TanBin
    姓名: 谭斌
    身份标签: 职场精英女 / 销售经理 / 专业冷静
    年龄感: 25-30岁
    外貌特征:
      - 修长结实双腿，腰腹无赘肉
      - 英姿飒爽中带妩媚
      - 深蓝色正装
      - 黑眼圈（睡眠不足）
    性格特点:
      - 专业冷静，情绪控制力强
      - 勤奋自律（晨跑习惯）
      - 做事稳当，职业素养高
      - 清醒自知，不自欺
