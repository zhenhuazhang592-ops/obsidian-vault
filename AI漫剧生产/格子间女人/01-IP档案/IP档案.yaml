    隐藏身份: 无
    关系:
      protagonist_01: 敬畏/效仿对象
      supporting_02: 大学同学/盟友

  - id: supporting_02
    英文名: YuYonglin
    姓名: 余永麟（Tony）
    身份标签: 销售总监 / 谭斌直接上司 / 顾家男人
